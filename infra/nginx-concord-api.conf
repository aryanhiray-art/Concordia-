# Public vhost for the Concord API. Two reasons it must be public HTTPS:
#  1. Robinhood redirects the OAuth callback here (/oauth/robinhood/callback).
#  2. The Vercel voting app calls it from members' browsers.
# CORS is handled by FastAPI; nginx just terminates TLS and proxies to uvicorn.
#
# Install: copy to /etc/nginx/sites-available/concord-api, symlink into
# sites-enabled, then `certbot --nginx -d concord-api.<your-domain>` and reload.

server {
    listen 80;
    server_name concord-api.example.com;          # <-- set your domain
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name concord-api.example.com;           # <-- set your domain

    # ssl_certificate / ssl_certificate_key managed by certbot
    ssl_certificate     /etc/letsencrypt/live/concord-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concord-api.example.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
