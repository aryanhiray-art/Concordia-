# Single public vhost for Concordia: everything → the Next.js member app (:3002),
# which itself proxies /api + /oauth to the backend (:8780) via FORGE_BACKEND
# rewrites — so the browser only ever sees one same-origin host.
#
# Install: sed "s/__HOST__/your.hostname/" this file →
#   /etc/nginx/sites-available/concord-web, symlink into sites-enabled,
#   then `certbot --nginx -d your.hostname` and reload.

server {
    listen 80;
    server_name __HOST__;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __HOST__;

    # ssl_certificate / ssl_certificate_key added by certbot

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"        always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header Referrer-Policy           "no-referrer" always;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
