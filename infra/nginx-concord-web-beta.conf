# BETA vhost: beta.voteconcordia.com → the beta Next.js app (:3004 — 3003 is
# the DEMO web), which
# proxies /api + /oauth to the beta backend (:8782) via FORGE_BACKEND rewrites —
# same single same-origin-host shape as the live vhost (nginx-concord-web.conf).
#
# DELIBERATELY HTTP-ONLY: certbot --nginx adds the 443 server + redirect itself
# (a pre-written ssl block without certs makes `nginx -t` fail before certbot
# can ever run — the bootstrap chicken-and-egg we hit on 2026-07-23).
#
# Install: copy to /etc/nginx/sites-available/concord-web-beta, symlink into
#   sites-enabled, reload, then (once DNS resolves to this box)
#   `certbot --nginx -d beta.voteconcordia.com`.

server {
    listen 80;
    server_name beta.voteconcordia.com;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
