# Public vhost for the Concord API. Two reasons it must be public HTTPS:
#  1. Robinhood redirects the OAuth callback here (/oauth/robinhood/callback).
#  2. The Vercel voting app calls it from members' browsers.
# CORS is handled by FastAPI; nginx just terminates TLS and proxies to uvicorn.
#
# Install: copy to /etc/nginx/sites-available/concord-api, symlink into
# sites-enabled, then `certbot --nginx -d concord-api.<your-domain>` and reload.

# ── Rate-limit zone (finding #31) ───────────────────────────────────────────
# limit_req_zone is an http{}-context directive. Files under sites-enabled/*
# are `include`d INSIDE the http{} block, so this top-level line is in http
# context and is valid here. If your nginx.conf includes this file somewhere
# else (e.g. inside a server{} block) nginx will refuse to start with
# "limit_req_zone directive is not allowed here" — in that case move ONLY this
# next line into the main /etc/nginx/nginx.conf http{} block and leave the
# per-location `limit_req` directives below in place.
limit_req_zone $binary_remote_addr zone=concord_auth:10m rate=30r/m;

# ── Unknown-Host catch-all → 444 (finding #31) ──────────────────────────────
# Bare-IP / bogus-SNI scanners hitting this box get their connection dropped
# instead of falling through to the real vhost.
# NOTE: only ONE server may be `default_server` per listen address. If another
# forge vhost on this box already declares default_server on :80/:443, drop the
# `default_server` keyword from the two `listen` lines below (server_name _ still
# catches unmatched Hosts as the fallback of last resort for THIS include order).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    # Reject the TLS handshake outright (no cert needed). Requires nginx >= 1.19.4.
    # On older nginx, delete the next line and instead point ssl_certificate /
    # ssl_certificate_key at any existing cert on the box so the handshake can
    # complete before the `return 444`.
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name concord-api.example.com;          # <-- set your domain
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name concord-api.example.com;           # <-- set your domain

    # ssl_certificate / ssl_certificate_key managed by certbot
    ssl_certificate     /etc/letsencrypt/live/concord-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concord-api.example.com/privkey.pem;

    client_max_body_size 1m;

    # ── Security headers (finding #31) ──────────────────────────────────────
    # Applied at server scope; inherited by every location that sets no
    # add_header of its own (none below do). `always` = emit on error responses
    # too. HSTS lives only on the TLS vhost (never on the :80 redirect above).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"           always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "no-referrer"    always;

    # Shared upstream settings — inherited by each location's proxy_pass (a
    # location that sets its own proxy_set_header would reset ALL of these, so
    # none of the locations below do).
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;

    # ── Owner-only surfaces → localhost + allowlisted admin IP only (finding #20)
    # /api/admin/*  = arm/kill/overview/manual-run (also covers /api/admin/program/*)
    # /api/program/* = external-automation (research-voter) endpoints
    # Everything else (auth, vote, member, OAuth, /health) stays public below.
    location /api/admin {
        allow 127.0.0.1;
        allow ::1;
        # allow <YOUR_ADMIN_IP>;   # <-- FILL IN: the owner/dashboard public IP (or CIDR)
        deny all;
        proxy_pass http://127.0.0.1:8780;
    }
    location /api/program {
        allow 127.0.0.1;
        allow ::1;
        # allow <YOUR_ADMIN_IP>;   # <-- FILL IN: same admin IP as above (or CIDR)
        deny all;
        proxy_pass http://127.0.0.1:8780;
    }

    # ── Auth + OAuth → rate limited (finding #31) ───────────────────────────
    # burst absorbs a normal connect flow (start → complete → callback); excess
    # is rejected (503) rather than queued, so a brute-forcer can't stall workers.
    location /api/auth {
        limit_req zone=concord_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    location /api/oauth/ {
        limit_req zone=concord_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    location /oauth/ {                      # public Robinhood redirect callback
        limit_req zone=concord_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }

    # ── Public health check (unthrottled) ───────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:8780;
    }

    # ── Everything else (members, voting, universe, me, …) ──────────────────
    location / {
        proxy_pass http://127.0.0.1:8780;
    }
}
