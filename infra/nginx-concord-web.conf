# Single public vhost for Concordia: everything → the Next.js member app (:3002),
# which itself proxies /api + /oauth to the backend (:8780) via FORGE_BACKEND
# rewrites — so the browser only ever sees one same-origin host.
#
# Because this vhost IS the production path, the edge protections must live
# HERE (2026-08-23): the api vhost's limit_req/headers protected a route the
# live site never used, leaving auth brute-force to the in-process Python
# limiter and the arm/kill admin surface with no edge throttle at all.
#
# limit_req_zone is an http{}-context directive; files under sites-enabled/*
# are included inside http{}, so the zone lines at top of this file are valid
# there. Zone names are deliberately NOT shared with nginx-concord-api.conf so
# both files can be enabled on one box without a duplicate-zone error.
#
# DELIBERATELY HTTP-ONLY: certbot --nginx adds the 443 server + redirect itself
# (a pre-written ssl block without certs makes `nginx -t` fail before certbot
# can ever run — the bootstrap chicken-and-egg we hit on 2026-07-23).
#
# Install: sed "s/__HOST__/your.hostname/" this file →
#   /etc/nginx/sites-available/concord-web, symlink into sites-enabled, reload,
#   then (once DNS resolves to this box) `certbot --nginx -d your.hostname`.

limit_req_zone $binary_remote_addr zone=concord_web_auth:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=concord_web_admin:10m rate=60r/m;

server {
    listen 80;
    server_name __HOST__;

    client_max_body_size 1m;

    # `always` = emit on error responses too. HSTS is a no-op over plain HTTP
    # (browsers ignore it) but harmless — and present the moment certbot
    # copies these locations into the 443 block.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options           "DENY"           always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "no-referrer"    always;

    # credential endpoints: throttle brute force at the edge, before Next/py
    location /api/auth/ {
        limit_req zone=concord_web_auth burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # Robinhood OAuth surface: same throttle rationale as auth (anti-brute,
    # and the backend's token exchange is a slow worker-stalling call)
    location /api/oauth/ {
        limit_req zone=concord_web_auth burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
    location /oauth/ {
        limit_req zone=concord_web_auth burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # anonymous health probe: tiny limit — it is a DB-touching endpoint
    location = /api/health {
        limit_req zone=concord_web_auth burst=5 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # real-money admin surface (arm/kill/execute): session-auth'd in the app,
    # rate-limited here so the token/session can't be hammered from the edge
    location /api/admin/ {
        limit_req zone=concord_web_admin burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
